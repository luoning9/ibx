# IBX 主配置文件
# 说明：
# 1) 该文件用于放置应用级全局配置（不再依赖环境变量细节开关）。
# 2) 留空字符串 "" 表示“使用系统默认值/默认路径”。

[ib_gateway]
# IB Gateway / TWS 连接参数
# - trading_mode 决定默认走 paper_port 还是 live_port
# - paper/live 端口都保留，便于同一份配置切换模式
# - client_id 为兜底值；未显式配置时按 broker_data/market_data/order/cli => +0/+1/+2/+3 分配
host = "127.0.0.1"
paper_port = 4002
live_port = 4001
timeout_seconds = 42
# 账户代码；留空表示由 IB 返回的默认账户
account_code = ""
# 可选: "paper" | "live"
trading_mode = "paper"

[ib_gateway.role_ports]
# 按角色分别指定 API 端口（一个 broker 线程管理多连接）
broker_data = 4002
market_data = 4002
order = 4002
cli = 4002

[ib_gateway.role_connections.broker_data]
client_id = 99
readonly = true

[ib_gateway.role_connections.market_data]
client_id = 98
readonly = true

[ib_gateway.role_connections.order]
client_id = 96
readonly = false

[ib_gateway.role_connections.cli]
client_id = 97
readonly = true

[runtime]
# 运行时路径与全局开关
# 留空表示使用缺省路径（项目内 data/）
# data_dir 是根目录；db/log/cache 的空值会在该根目录下自动推导
data_dir = ""
db_path = ""
log_path = ""
market_data_log_path = ""
market_cache_db_path = ""
# 市场映射配置文件（market -> sec_type/exchange/currency）
market_config_path = "conf/markets.json"
# live 交易总开关（即使 trading_mode=live，也需该开关显式为 true）
enable_live_trading = false

[trade_validation]
# 下单前核验配置
# 允许的下单方向（默认 BUY/SELL）
allowed_sides = ["BUY", "SELL"]
# 允许的订单类型（默认 MKT/LMT）
allowed_order_types = ["MKT", "LMT"]
# 是否允许盘前/盘后（outside regular trading hours）下单
allow_outside_rth = true
# BUY/OPEN 的最大金额（USD）
buy_open_max_amount_usd = 1000
# 是否允许 live 下单
allow_live_orders = false

[worker]
# 策略执行引擎配置（扫描 + 线程池）
enabled = true
# 扫描周期（秒）
monitor_interval_seconds = 20
# 最大监测间隔（分钟）：当 now < suggested_next_monitor_at 且 now < evaluated_at + 本值 时，ACTIVE 直接跳过本轮
max_monitoring_interval_minutes = 60
# worker 线程数
threads = 1
# 策略任务队列上限
queue_maxsize = 128
# 事件节流：网关不可用事件最小间隔（秒）
gateway_not_work_event_throttle_seconds = 300
# 事件节流：行情未就绪事件最小间隔（秒）
waiting_for_market_data_event_throttle_seconds = 120

[providers]
# 外部依赖提供者选择
# - "ib": 真实 IB 连接
# - "fixture": 本地样本数据（离线测试）
broker_data = "ib"
market_data = "ib"
# true 时 market_data 直连 IB，不读写本地行情缓存
market_data_disable_cache = false
# 行情延迟窗口（分钟）：窗口内末端空白会保留为“待重拉”
# 默认 20 = 15 分钟免费延迟 + 5 分钟缓冲
market_data_delay_window_minutes = 20
